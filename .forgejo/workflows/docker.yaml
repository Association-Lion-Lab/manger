{
  "name": "Docker integrity",
  "on": {"push":{"branches":["development","main"]},"workflow_dispatch":{}},
  "jobs": {
    "tests": {
      "name": "Tests (${{ matrix.storage }})",
      "runs-on": "manger-docker",
      "timeout-minutes": 20,
      "permissions": {"contents":"read"},
      "strategy": {"fail-fast":false,"matrix":{"storage":["sqlite","postgres"]}},
      "env": {
        "CI_STORAGE":"${{ matrix.storage }}",
        "MANGER_TEST_PG_BIN":"${{ vars.MANGER_TEST_PG_BIN }}"
      },
      "steps": [
        {
          "uses":"https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with":{"persist-credentials":false}
        },
        {
          "name":"Verify tools and frozen dependencies",
          "run":"set -eu\nnode -e 'if (Number(process.versions.node.split(\".\")[0]) < 24) process.exit(1)'\ncommand -v openssl\nnpm ci --ignore-scripts"
        },
        {
          "name":"Require explicit native PostgreSQL tools",
          "run":"set -eu\nif [ \"$CI_STORAGE\" = postgres ]; then\n  node -e 'const p=process.env.MANGER_TEST_PG_BIN; if (!p || !require(\"node:path\").isAbsolute(p) || process.getuid()===0) { console.error(\"PostgreSQL CI exige un compte non root et MANGER_TEST_PG_BIN absolu.\"); process.exit(1); } for (const name of [\"initdb\",\"pg_ctl\",\"postgres\",\"pg_dump\",\"pg_restore\"]) require(\"node:fs\").accessSync(require(\"node:path\").join(p,name),require(\"node:fs\").constants.X_OK);'\nfi"
        },
        {
          "name":"Run the selected storage suite without fallback",
          "run":"set -eu\ncase \"$CI_STORAGE\" in\n  sqlite) npm test ;;\n  postgres) npm run test:postgres ;;\n  *) echo 'Moteur CI inconnu : refus.' >&2; exit 1 ;;\nesac"
        }
      ]
    },
    "docker": {
      "name":"Docker integrity",
      "needs":["tests"],
      "runs-on":"manger-docker",
      "timeout-minutes":20,
      "permissions":{"contents":"read"},
      "env":{"CI_IMAGE":"manger-ci:job-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"},
      "steps":[
        {
          "uses":"https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with":{"persist-credentials":false}
        },
        {
          "name":"Verify tools, frozen dependencies and dependency audit",
          "run":"set -eu\nnode -e 'if (Number(process.versions.node.split(\".\")[0]) < 24) process.exit(1)'\ncommand -v openssl\ndocker info > /dev/null\ndocker compose version\nnpm ci --ignore-scripts\nnpm audit --omit=dev --audit-level=high"
        },
        {
          "name":"Validate standard Compose and synthetic build context",
          "run":"set -eu\ndocker compose -f compose.yaml config --quiet\ndocker compose -f compose.yaml -f compose.https.yaml config --quiet\nnode scripts/check-docker-context.js"
        },
        {
          "name":"Build candidate and tools, require both storage scenarios and recovery",
          "run":"set -eu\ndocker build --pull -t \"$CI_IMAGE\" .\ndocker build --build-arg MANGER_CANDIDATE_IMAGE=\"$CI_IMAGE\" -f docker/postgres-tools.Dockerfile -t \"$CI_IMAGE-tools\" .\nsh scripts/test-docker.sh \"$CI_IMAGE\"\nsh scripts/test-postgres-image.sh \"$CI_IMAGE\" \"$CI_IMAGE-tools\" --admin-https"
        }
      ]
    }
  }
}
