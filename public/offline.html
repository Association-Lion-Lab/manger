<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manger! — Hors connexion</title>
<style>
:root{color-scheme:light dark;--accent:#236447;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#1d1d1f}body{max-width:620px;margin:auto;padding:28px 20px;padding-bottom:max(28px,env(safe-area-inset-bottom))}h1{font-size:28px;margin-bottom:6px}p{color:#68686d}ul{padding:0;list-style:none}li{padding:16px 0;border-bottom:1px solid #aaa5;overflow-wrap:anywhere}.done span{text-decoration:line-through}a,button{display:block;padding:14px 18px;margin-top:14px;border:1px solid #aaa6;border-radius:16px;text-align:center;color:inherit;background:transparent;font:inherit}a{background:var(--accent);color:white;text-decoration:none}button{width:100%;cursor:pointer}@media(prefers-color-scheme:dark){:root{--accent:#98d7b1;background:#101012;color:#f5f5f7}p{color:#aaaab2}a{color:#101012}}
details{border:1px solid #aaa6;border-radius:20px;padding:16px;margin:14px 0}summary{cursor:pointer;min-height:44px;font-weight:650;overflow-wrap:anywhere}h2{margin-top:32px}h3{font-size:18px}ol{padding-left:24px}li p{color:inherit;white-space:pre-wrap}small{display:block;margin-top:8px}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.source{background:transparent;color:inherit}*{box-sizing:border-box}
.timer-controls{display:flex;flex-wrap:wrap;gap:8px}.timer-controls button{flex:1 1 140px;min-height:48px;margin-top:8px}.timer-value{font-variant-numeric:tabular-nums}.timer-notice:empty{display:none}
.recipe-photo{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin:16px 0}
.shopping-item{padding:0}.shopping-item label{display:flex;align-items:center;gap:14px;min-height:56px;padding:12px 0;cursor:pointer}.shopping-item input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--accent)}.shopping-item span{min-width:0}input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}#shopping-progress{font-weight:650;color:inherit}#shopping-error:empty{display:none}
</style></head><body><h1>Hors connexion</h1><p>Copies locales · elles peuvent être anciennes.</p><h2>Courses enregistrées</h2><p id="status" role="status"></p><p>Au retour du réseau, ouvre Manger puis Courses pour envoyer tes nouveaux achats au foyer. Les décoches restent sur cet appareil.</p><p id="shopping-pending" role="status"></p><p id="shopping-progress" role="status"></p><p id="shopping-error" role="alert"></p><ul id="items"></ul>
<section id="recipes" aria-labelledby="recipes-heading"><h2 id="recipes-heading" tabindex="-1">Recettes enregistrées</h2><p id="recipes-status" role="status"></p><div id="recipe-copies"></div></section>
<a href="/">Revenir à Manger</a><button id="clear" type="button">Effacer toutes les copies sur cet appareil</button>
<script src="/offline-recipes.js"></script>
<script src="/offline-shopping.js"></script>
<script>
const list = document.getElementById('items'), status = document.getElementById('status');
let timers = [];
function timerSeconds(timer, now = Date.now()) {
  return timer.end == null ? timer.remaining : Math.max(0, Math.ceil((timer.end - now) / 1000));
}
setInterval(() => timers.forEach(update => update()), 1000);
document.addEventListener('visibilitychange', () => timers.forEach(update => update()));
function saveShoppingCheck(revision, index, checked) {
  if (localStorage.getItem('manger-shopping-offline-v1') !== revision) throw new Error('La copie a changé dans un autre onglet. Elle a été rechargée : coche à nouveau cet article.');
  const snapshot = JSON.parse(revision);
  snapshot.items[index].checked = checked;
  const updated = JSON.stringify(snapshot);
  localStorage.setItem('manger-shopping-offline-v1', updated);
  return updated;
}
function shoppingProgress(snapshot) {
  const remaining = snapshot.items.filter(item => !item.checked).length;
  document.getElementById('shopping-progress').textContent = snapshot.items.length ? (remaining ? `${remaining} article${remaining > 1 ? 's' : ''} restant${remaining > 1 ? 's' : ''} · coches locales` : 'Tout est dans le panier · coches locales') : '';
  const count = offlineShopping.pending(snapshot).length;
  document.getElementById('shopping-pending').textContent = snapshot.version !== 2 ? 'Ancienne copie : coches locales uniquement. Enregistre une nouvelle liste en ligne pour pouvoir envoyer les achats.' : count ? `${count} nouvel achat${count > 1 ? 's' : ''} à envoyer au foyer, une fois en ligne.` : '';
}
function show() {
  list.replaceChildren();
  document.getElementById('shopping-progress').textContent = '';
  document.getElementById('shopping-pending').textContent = '';
  const error = document.getElementById('shopping-error'); error.textContent = '';
  try {
    let revision = localStorage.getItem('manger-shopping-offline-v1');
    const snapshot = offlineShopping.read(localStorage);
    if (!snapshot || !Array.isArray(snapshot.items)) { status.textContent = 'Aucune liste enregistrée. Active la copie hors connexion dans Courses quand le serveur est accessible.'; return; }
    if (snapshot.items.some(item => !item || typeof item.text !== 'string' || typeof item.checked !== 'boolean')) throw new Error('Copie invalide');
    status.textContent = `Semaine du ${snapshot.week} · mise à jour le ${new Date(snapshot.savedAt).toLocaleString('fr-FR')}. Cette copie peut être ancienne.`;
    shoppingProgress(snapshot);
    if (!snapshot.items.length) { const row = document.createElement('li'); row.textContent = 'Aucun article dans cette copie.'; list.append(row); }
    for (const [index, item] of snapshot.items.entries()) {
      const row = document.createElement('li'), label = document.createElement('label'), checkbox = document.createElement('input'), text = document.createElement('span');
      row.className = 'shopping-item'; row.classList.toggle('done', item.checked);
      checkbox.type = 'checkbox'; checkbox.checked = item.checked; text.textContent = item.text;
      checkbox.onchange = () => {
        try {
          revision = saveShoppingCheck(revision, index, checkbox.checked);
          item.checked = checkbox.checked; row.classList.toggle('done', item.checked); shoppingProgress(snapshot); error.textContent = '';
        } catch (failure) {
          show();
          error.textContent = failure.name === 'QuotaExceededError' ? 'Stockage plein : cette coche n’a pas été enregistrée.' : failure.message.startsWith('La copie a changé') ? failure.message : 'Stockage indisponible : cette coche n’a pas été enregistrée.';
        }
      };
      label.append(checkbox, text); row.append(label); list.append(row);
    }
  } catch { status.textContent = 'Copie indisponible sur cet appareil.'; }
}
function showRecipes() {
  timers = [];
  const container = document.getElementById('recipe-copies'), message = document.getElementById('recipes-status'); container.replaceChildren();
  const element = (tag, text) => { const node = document.createElement(tag); node.textContent = text; return node; };
  try {
    const recipes = offlineRecipes.read(localStorage);
    message.textContent = recipes.length ? `${recipes.length} recette(s) · copies manuelles, sans mise à jour automatique.` : 'Aucune recette enregistrée. Ouvre une recette en ligne puis « Cette recette hors connexion ».';
    for (const recipe of recipes) {
      const card = document.createElement('details'), summary = element('summary', recipe.title);
      summary.append(element('small', `${recipe.minutes} min · ${recipe.portions} portions`)); card.append(summary);
      if (recipe.photo) { const photo = document.createElement('img'); photo.className = 'recipe-photo'; photo.src = recipe.photo; photo.alt = `Photo de ${recipe.title}`; card.append(photo); }
      card.append(element('p', `Copie du ${new Date(recipe.savedAt).toLocaleString('fr-FR')}. Instructions et durées d’origine : adapte la cuisson aux portions choisies.`));
      if (recipe.steps.some(step => step.minutes > 0)) card.append(element('small', 'Minuteurs locaux, sans son ni alarme garantie en arrière-plan. Garde cette page ouverte ; recharger ou modifier les copies les remet à zéro.'));
      else if (recipe.steps.some(step => !Object.hasOwn(step, 'minutes'))) card.append(element('small', 'Pour obtenir les minuteurs, enregistre à nouveau cette recette depuis sa fiche en ligne.'));
      card.append(element('h3', 'Ingrédients')); const ingredients = document.createElement('ul');
      for (const ingredient of recipe.ingredients) ingredients.append(element('li', ingredient)); card.append(ingredients);
      card.append(element('h3', 'Réalisation')); const steps = document.createElement('ol');
      for (const [index, step] of recipe.steps.entries()) {
        const row = document.createElement('li'); row.append(element('strong', step.label), element('p', step.text));
        if (step.minutes > 0) {
          const timer = { remaining: step.minutes * 60, end: null, started: false };
          const value = element('p', ''), notice = element('p', ''), controls = document.createElement('div');
          value.className = 'timer-value'; notice.className = 'timer-notice'; notice.setAttribute('role', 'status'); controls.className = 'timer-controls';
          const toggle = element('button', ''), reset = element('button', 'Réinitialiser'); toggle.type = reset.type = 'button';
          reset.setAttribute('aria-label', `Réinitialiser le minuteur de l’étape ${index + 1}`);
          const update = () => {
            const seconds = timerSeconds(timer);
            value.textContent = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}${timer.started && timer.end == null ? ' · en pause' : ''}`;
            toggle.textContent = seconds === 0 ? 'Relancer' : timer.end != null ? 'Pause' : timer.started ? 'Reprendre' : 'Démarrer le minuteur';
            toggle.setAttribute('aria-label', `${toggle.textContent} · étape ${index + 1}`);
            const message = timer.started && seconds === 0 ? 'Minuteur terminé — vérifie la cuisson.' : '';
            if (notice.textContent !== message) notice.textContent = message;
          };
          toggle.onclick = () => {
            const seconds = timerSeconds(timer);
            if (timer.end != null && seconds > 0) { timer.remaining = seconds; timer.end = null; }
            else { if (seconds === 0) timer.remaining = step.minutes * 60; timer.end = Date.now() + timer.remaining * 1000; timer.started = true; }
            update();
          };
          reset.onclick = () => { timer.remaining = step.minutes * 60; timer.end = null; timer.started = false; update(); };
          timers.push(update); update(); controls.append(toggle, reset); row.append(value, controls, notice);
        }
        steps.append(row);
      } card.append(steps);
      if (recipe.sourceUrl) { try { const url = new URL(recipe.sourceUrl); if (['https:', 'http:'].includes(url.protocol)) { const source = element('a', 'Site d’origine · connexion nécessaire'); source.href = url.href; source.rel = 'noreferrer noopener'; source.className = 'source'; card.append(source); } } catch {} }
      const remove = element('button', 'Retirer cette copie'); remove.type = 'button'; remove.setAttribute('aria-label', `Retirer la copie de ${recipe.title}`);
      remove.onclick = () => { try { offlineRecipes.remove(localStorage, recipe.id); showRecipes(); document.getElementById('recipes-heading').focus(); } catch { message.textContent = 'Impossible de retirer cette copie.'; } }; card.append(remove); container.append(card);
    }
  } catch { message.textContent = 'Copies de recettes indisponibles. Tu peux les effacer puis les enregistrer à nouveau en ligne.'; }
}
document.getElementById('clear').onclick = () => { try { localStorage.removeItem('manger-shopping-offline-v1'); localStorage.removeItem('manger-offline-enabled'); localStorage.removeItem('manger-recipes-offline-v1'); show(); showRecipes(); } catch { status.textContent = 'Impossible d’effacer les copies.'; } };
addEventListener('storage', event => {
  if (event.key === null || event.key === 'manger-shopping-offline-v1') show();
  if (event.key === null || event.key === offlineRecipes.KEY || event.key === 'manger-auth-change') showRecipes();
});
addEventListener('pageshow', () => { show(); showRecipes(); });
show(); showRecipes();
</script></body></html>
